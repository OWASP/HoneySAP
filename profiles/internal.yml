# HoneSAP default internal profile configuration
# ==============================================

# Console logging configuration
# -----------------------------

# Level of console logging
verbose: 2

# Use colored output
colored_console: true


# Miscellaneous configuration
# ---------------------------

# Enable reloading after a change in one of the configuration files
reload: false

# Address to listen for all services
listener_address: 0.0.0.0


# Evidence logging
# ----------------
# Global defaults; a service can override single options in its own
# "logging:" mapping.
logging:
    # Keep the bytes received/sent on the wire in request/response
    raw_payloads: true
    # Emit a "Sent packet" event with the bytes sent for each request
    response_events: true
    # Cap for each request/response field in bytes (0 = no cap)
    max_payload_bytes: 65536
    # Connection lifecycle events: none, close or all
    connection_events: close
    # Emit "Unparsed input" for data that cannot be decoded or handled
    unparsed_input: true
    # HTTP services: log all request headers in order
    http_headers: true
    # HTTP services: log the request body
    http_body: true
    # HTTP services: log static resources (UI5 files of the launchpad)
    static_assets: false
    # HTTP services: decode parameters and report submitted credentials
    http_params: true


# SAP system configuration
# ------------------------
# Identity of the emulated system, reported the same way by all services.
# Service options with the same meaning (hostname, sid, instance_number,
# client_no, sap_release, db_system, os_name) override these values.

system:
    sid: PRD
    hostname: sapnw702
    instance_number: "00"
    client: "001"
    # Logon language (error pages, logon screens)
    language: EN
    # SAP_BASIS release and kernel release
    release: "816"
    kernel_release: "916"
    db_system: HDB
    os: Linux
    # Address reported to clients; defaults to the address they connected to
    # ip_address: 192.0.2.10


# Services configuration
# ----------------------

services:
    -
        # SAP Dispatcher service
        # ----------------------
        service: SAPDispatcherService
        alias: ExternalDispatcherService
        enabled: yes
        listener_port: 3200

    -
        # SAP Gateway service
        # -------------------
        service: SAPGatewayService
        alias: GatewayService
        enabled: yes
        listener_port: 3300
        listener_address: 0.0.0.0

        # Optional: path to a semicolon-delimited RFM catalog CSV (exported
        # from SAP with columns FUNCNAME;REMOTE_CALL;UPDATE_TASK;...PARAMTEXT).
        # When set, the gateway will serve RFC_GET_FUNCTION_INTERFACE responses
        # for any function module present in the catalog.
        rfm_catalog: data/honeysap_rfm.csv
        # Optional: path to the DDIC structure field definitions CSV (exported
        # from SAP alongside the RFM catalog).  Used for DDIF_FIELDINFO_GET
        # type lookups.
        ddic_catalog: data/honeysap_ddic.csv

    -
        # SAP ICM (HTTP) service
        # ----------------------
        service: SAPICMService
        alias: ICMService
        enabled: yes
        listener_port: 8000
        # Fiori launchpad over HTTP; require_https: yes answers
        # "403 Forbidden - SSL required" like an ICM instead
        fiori_launchpad:
            enabled: yes
            bundle: data/icm/flp/flp_bundle.tar.xz
            require_https: no

    -
        # SAP ICM (HTTPS) service
        # -----------------------
        service: SAPICMService
        alias: ICMHTTPSService
        enabled: yes
        listener_port: 44300
        tls:
            enabled: yes
            # Without cert_file/key_file a certificate is generated at
            # startup; mimic_icm copies the ICM TLS behavior
            mimic_icm: yes
        # SAP Fiori launchpad, see docs/user/services/icm.rst
        fiori_launchpad:
            enabled: yes
            bundle: data/icm/flp/flp_bundle.tar.xz
            # list (default credentials or "credentials:"), accept_any or
            # reject_all
            auth_mode: list

    -
        # SAP Message Server (TCP) service
        # --------------------------------
        service: SAPMSService
        alias: MessageServerService
        enabled: yes
        listener_port: 3600

    -
        # SAP Message Server (HTTP) service
        # ---------------------------------
        service: SAPMSHTTPService
        alias: MessageServerHTTPService
        enabled: yes
        listener_port: 8100
        # Redirect clients to the ICM authority they used to reach this service.
        redirect_hostname: request
        # Values answered by /msgserver/*/parameter on top of the built-in
        # ones (null removes a parameter)
        # profile_parameters:
        #     login/min_password_lng: 6


# Metrics of the event pipeline
# -----------------------------

# Metrics records in the log feeds every 300 seconds; uncomment to serve
# them to Prometheus as well
#metrics:
#    interval: 300
#    prometheus: {enabled: yes, listener_address: 127.0.0.1, listener_port: 9180}

# Feeds configuration
# -------------------

feeds:
    -
        feed: LogFeed
        log_filename: logs/honeysap-internal.log
        enabled: yes
    -
        feed: ConsoleFeed
        enabled: yes
    -
        feed: HPFeed
        channels:
            - honeysap.events
        feed_host: 10.250.250.20
        feed_port: 20000
        feed_ident: honeysap
        feed_secret: password
        enabled: no
