fields:
  counter: "1"
  component: "NI (network interface)"
  release: "$release"
  version: "$router_version"
  module: ""
  location: "SAProuter $router_version.$router_version_patch on '$hostname'"
error_time_format: "%a %b %d %H:%M:%S %Y"
partner_name_mode: literal
max_request_length: null
oversized_request_error: false
unknown_packet_error: false
error_count:
  enabled: false
  start: 1
  default_error_step: 1
  version_request_step: 0
  route_accept_step: 0
  raw_unreachable_step: 0
errors:
  packet_too_big:
    return_code: -93
    error: "Network packet too big"
    detail: "message length $request_length exceeds max ($max_request_length)"
    count_step: 1
  invalid_route:
    return_code: -93
    error: "internal error"
    detail: "invalid route received"
    line_by_reason:
      no_hops: ""
      no_hops_one_entry: ""
      missing_route_bytes: ""
      bad_length: ""
      bad_entries: ""
      zero_offset: ""
      bad_offset: ""
      bad_rest: ""
    count_step: 1
  route_version_old:
    return_code: -96
    error: "invalid client version"
    detail: "route version $route_ni_version too old"
    count_step: 1
  host_empty:
    return_code: -90
    error: "hostname '' unknown"
    detail: "hostname empty"
    count_step: 1
  host_unknown:
    return_code: -90
    error: "hostname '$target_host' unknown"
    detail: "hostname '$target_host' not found"
    count_step: 1
  service_invalid:
    return_code: -91
    error: "service '$target_port' unknown"
    count_step: 1
  route_expected:
    return_code: -93
    error: "internal error"
    detail: "route expected"
    count_step: 1
  route_denied:
    return_code: -94
    error: "$hostname: route permission denied ($peer_ip to $target_host, $target_port)"
    detail: ""
    count_step: 1
  partner_unreachable:
    return_code: -92
    error: "partner '$partner_host:$target_port' not reached"
    detail: ""
    count_step: 1
  control_unknown:
    return_code: -13
    error: "invalid client version"
    detail: "unknown opcode $opcode received"
    count_step: 1
  admin_denied_base:
    return_code: -94
    error: "Admin from remote denied"
    count_step: 1
  admin_info_denied:
    extends: admin_denied_base
  admin_denied:
    extends: admin_denied_base
  admin_password_denied:
    return_code: -94
    error: "route denied"
    count_step: 1
  timeout:
    return_code: -5
    error: "connection timed out"
    detail: "no route received within ${timeout}s"
    count_step: 1
