# GitHub Action workflow to build and test HoneySAP
#

name: Build and test HoneySAP

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Check code health
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout HoneySAP
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Install lint dependencies
        run: |
          uv pip install --system flake8
      - name: Run flake8 (syntax errors only)
        run: |
          flake8 . --count --select=E901,E999,F821,F822,F823 --show-source --statistics
      - name: Run flake8 (style warnings)
        run: |
          flake8 . --count --ignore=E501 --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Run unit tests and build wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout HoneySAP
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-test.txt
      - name: Install pysap
        run: |
          uv pip install --system "git+https://github.com/OWASP/pysap.git"
      - name: Install Python dependencies
        run: |
          uv pip install --system wheel setuptools build
          uv pip install --system -r requirements.txt -r requirements-test.txt
          uv pip install --system -e .
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
      - name: Build wheel artifact
        run: |
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  docs:
    name: Build documentation and source package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout HoneySAP
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-docs.txt
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz pandoc texlive-latex-base
      - name: Install pysap
        run: |
          uv pip install --system "git+https://github.com/OWASP/pysap.git"
      - name: Install Python dependencies
        run: |
          uv pip install --system wheel setuptools build
          uv pip install --system -r requirements-docs.txt
      - name: Install the library
        run: |
          uv pip install --system -e .
      - name: Build documentation
        run: |
          python -m sphinx -b html docs docs/_build/html
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: error
      - name: Build source artifact
        run: |
          python -m build --sdist
      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [health, test, docs]
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "HoneySAP ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
